<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>网页答题助手 · 模型设置</title>
  <style>
    body { max-width: 720px; margin: 28px auto; padding: 0 20px; font: 14px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #1f2328; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { color: #57606a; font-size: 12px; margin-bottom: 22px; }
    fieldset { border: 1px solid #d0d7de; border-radius: 8px; padding: 14px 16px 16px; margin: 0 0 16px; }
    legend { padding: 0 6px; font-weight: 600; font-size: 13px; }
    label { display: block; margin: 10px 0 4px; font-size: 13px; }
    input[type=text], input[type=password], input[type=number], select {
      width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 13px; font-family: inherit;
    }
    .hint { color: #57606a; font-size: 11px; margin-top: 3px; }
    .chk { display: flex; align-items: center; gap: 7px; margin: 8px 0; font-size: 13px; }
    .chk input { width: auto; margin: 0; }
    .btns { display: flex; gap: 10px; align-items: center; }
    button { padding: 8px 18px; border-radius: 6px; border: 1px solid #d0d7de; background: #f6f8fa; cursor: pointer; font-size: 13px; font-family: inherit; }
    #save { background: #0f7b6c; border-color: #0f7b6c; color: #fff; }
    #msg { font-size: 12px; color: #0f7b6c; }
    #msg.err { color: #b42318; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  </style>
</head>
<body>
  <h1>模型设置</h1>
  <div class="sub">兼容 OpenAI 格式的任意接口。填完点保存即可生效。</div>

  <fieldset>
    <legend>接口</legend>
    <label>Base URL</label>
    <input type="text" id="baseUrl" placeholder="https://api.deepseek.com/v1">
    <div class="hint">只填到 /v1，不要带 /chat/completions。也支持 openrouter、硅基流动、本地 ollama（http://127.0.0.1:11434/v1）等。</div>

    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="sk-...">
    <div class="hint">本地 ollama 可随便填一个非空值。</div>

    <label>模型名</label>
    <input type="text" id="model" placeholder="deepseek-chat">
    <div class="hint">如 deepseek-chat、gpt-4o-mini、qwen-plus、glm-4-flash 等。</div>
  </fieldset>

  <fieldset>
    <legend>行为</legend>
    <div class="chk"><input type="checkbox" id="autoClick"><label for="autoClick" style="margin:0">自动选择选项</label></div>
    <div class="chk"><input type="checkbox" id="scrollMode"><label for="scrollMode" style="margin:0">整页滚动模式（题目上下滑动的页面勾这个）</label></div>
    <div class="chk"><input type="checkbox" id="startTop"><label for="startTop" style="margin:0">开始时先回到页面顶部</label></div>
    <div class="chk"><input type="checkbox" id="showPanel"><label for="showPanel" style="margin:0">页面加载时显示面板</label></div>
    <div class="grid">
      <div>
        <label for="delayMs">每题/翻页间隔(ms)</label>
        <input type="number" id="delayMs" min="200" step="100">
      </div>
      <div>
        <label for="maxRounds">最多翻多少页</label>
        <input type="number" id="maxRounds" min="1" step="1">
      </div>
    </div>
    <label for="temperature">temperature</label>
    <input type="number" id="temperature" min="0" max="2" step="0.1">
    <div class="hint">答题建议 0，结果最稳定。</div>
  </fieldset>

  <div class="btns">
    <button id="save">保存</button>
    <button id="test">测试连接</button>
    <span id="msg"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
